<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Ajouter Location</title>


</head>
<body>

    <h2>Ajouter une Location</h2>
    <form id="location-form" name="f2" action="" method="post">
        <table>
            <tr>
                <td><label >Immatriculation</label></td>
                <td><input type="number" id="x" name="x" placeholder="XXX">
                <span>TN</span><input type="number" id="Y" name="Y" placeholder="YYYY"> </td>
            </tr>
            <tr>
                <td><label>CIN</label></td>
                <td><input type="text" id="cin" name="cin" ></td>
            </tr>
            <tr>
                <td><label>Date de Location</label></td>
                <td><input type="date" id="dateloc" name="dateloc" ></td>
            </tr>
            <tr>
                <td><label>Nombre de Jours</label></td>
                <td><input type="" id="nbj" name="nbj"  min="1"></td>
            </tr>
            <tr>
                <td colspan="2"><input type="submit" value="Ajouter Location"></td>
            </tr>
        </table>
    </form>
