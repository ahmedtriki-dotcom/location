<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Ajouter Voiture</title>

</head>
<body>

    <h2>Ajouter une Voiture</h2>
    <form id="car-form" name="f1" method="post" action="" >
        <table>
            <tr>
                <td><label >Immatriculation</label></td>
                <td><input type="" id="x" name="x" placeholder="XXX"><span> TN </span>
                <input type="" id="Y" name="Y" placeholder="YYYY"> </td>
            </tr>
            <tr>
                <td><label >Type</label></td>
                <td><input type="text" id="type" name="type" ></td>
            </tr>
            <tr>
                <td><label >Année</label></td>
                <td><input type="" id="annee" name="annee"  min="1950" max="2099"></td>
            </tr>
            <tr>
                <td><label >Prix de Location</label></td>
                <td><input type="" id="prixLoc" name="prixLoc"  min="0" step="0.01"></td>
            </tr>
            <tr>
                <td colspan="2">
            <input type="submit" id="b2" value="Ajouter Voiture"></td>
            </tr>
        </table>
    </form>
